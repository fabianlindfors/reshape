[package]
name = "reshape"
version = "0.11.2"
description = "An easy-to-use, zero-downtime schema migration tool for Postgres"
homepage = "https://github.com/fabianlindfors/reshape"
documentation = "https://github.com/fabianlindfors/reshape"
repository = "https://github.com/fabianlindfors/reshape"
license = "MIT"
keywords = ["postgres", "migrations"]
edition = "2021"
authors = ["Fabian Lindfors"]
rust-version = "1.88"

[dependencies]
postgres = { version = "0.19.12", features = ["with-serde_json-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typetag = "0.2"
anyhow = { version = "1.0", features = ["backtrace"] }
clap = { version = "4.5", features = ["derive"] }
toml = "1"
version = "3.0.0"
colored = "3"
rand = "0.10"
dotenvy = "0.15"
lexical-sort = "0.3.1"
pg_query = "6.2"
native-tls = { version = "0.2", features = ["vendored"] }
postgres-native-tls = "0.5"
